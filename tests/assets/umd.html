<!DOCTYPE html>
<html charset="utf-8">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>GanttElastic demo</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs" crossorigin="anonymous"></script>
    <script src="/dist/GanttElastic.umd.js"></script>
  </head>

  <body>
    <div style="width:100%;height:100%">
      <div id="app" v-if="!destroy">
        <gantt-elastic ref="gantt" :tasks="tasks" :options="options" :dynamic-style="dynamicStyle">
        </gantt-elastic>
      </div>
    </div>

    <script>

      function getDate(hours) {
        const currentDate = new Date();
        const currentYear = currentDate.getFullYear();
        const currentMonth = currentDate.getMonth() + 1;
        const currentDay = currentDate.getDate();
        const timeStamp = new Date(`${currentYear}-${currentMonth}-${currentDay} 00:00:00`).getTime();
        return new Date(timeStamp + hours * 60 * 60 * 1000).getTime();
      }

      let tasks = [
        { id: 1, label: 'Make some noise', user: 'John Doe', start: getDate(-24 * 5), duration: 15 * 24 * 60 * 60 * 1000, percent: 85, type: 'project' },
        { id: 2, label: 'With great power comes great responsibility', user: 'Peter Parker', parentId: 1, start: getDate(-24 * 4), duration: 4 * 24 * 60 * 60 * 1000, percent: 50, type: 'milestone', collapsed: true },
        { id: 3, label: 'Courage is being scared to death, but saddling up anyway.', user: 'John Wayne', parentId: 2, start: getDate(-24 * 3), duration: 2 * 24 * 60 * 60 * 1000, percent: 100, type: 'task' },
        { id: 4, label: 'Put that toy AWAY!', user: 'Clark Kent', start: getDate(-24 * 2), duration: 2 * 24 * 60 * 60 * 1000, percent: 50, type: 'task', dependentOn: [3] },
        { id: 5, label: 'One billion, gajillion, fafillion... shabadylu...mil...shabady......uh, Yen.', user: 'Austin Powers', parentId: 4, start: getDate(0), duration: 2 * 24 * 60 * 60 * 1000, percent: 10, type: 'milestone', style: { base: { fill: '#0287D0', stroke: '#0077C0' } } },
        { id: 6, label: 'But I am tying my shoes.', user: 'Batman', parentId: 5, start: getDate(24), duration: 1 * 24 * 60 * 60 * 1000, percent: 20, type: 'task' },
        { id: 7, label: 'We are all working together.', user: 'Superman', parentId: 2, dependentOn: [6], start: getDate(24 * 2), duration: 4 * 24 * 60 * 60 * 1000, percent: 20, type: 'task', collapsed: true },
        { id: 8, label: 'I am Batman.', user: 'Batman', parentId: 7, dependentOn: [7], start: getDate(24 * 3), duration: 2 * 24 * 60 * 60 * 1000, percent: 0, type: 'task' },
        { id: 9, label: 'It is a bird. It is a plane.', user: 'Superman', start: getDate(24 * 4), duration: 2 * 24 * 60 * 60 * 1000, percent: 0, type: 'task' },
        { id: 10, label: 'There is no spoon.', user: 'Neo', parentId: 9, start: getDate(24 * 5), duration: 2 * 24 * 60 * 60 * 1000, percent: 0, type: 'task' },
        { id: 11, label: 'I will be back.', user: 'Terminator', parentId: 9, start: getDate(24 * 6), duration: 2 * 24 * 60 * 60 * 1000, percent: 0, type: 'task' },
        { id: 12, label: 'Do or do not. There is no try.', user: 'Yoda', parentId: 9, start: getDate(24 * 7), duration: 2 * 24 * 60 * 60 * 1000, percent: 0, type: 'task' },
        { id: 13, label: 'May the force be with you.', user: 'Yoda', parentId: 9, start: getDate(24 * 8), duration: 2 * 24 * 60 * 60 * 1000, percent: 0, type: 'task' },
        { id: 14, label: 'I am your father.', user: 'Darth Vader', parentId: 9, start: getDate(24 * 9), duration: 2 * 24 * 60 * 60 * 1000, percent: 0, type: 'task' },
        { id: 15, label: 'Live long and prosper.', user: 'Spock', parentId: 9, start: getDate(24 * 10), duration: 2 * 24 * 60 * 60 * 1000, percent: 0, type: 'task' }
      ];

      let options = {
        taskMapping: {
          progress: 'percent'
        },
        maxRows: 100,
        maxHeight: 500,
        title: {
          label: 'Your project title as html (link or whatever...)',
          html: false
        },
        row: {
          height: 24
        },
        calendar: {
          hour: {
            display: true
          }
        },
        chart: {
          progress: {
            bar: false
          },
          expander: {
            display: true
          }
        },
        taskList: {
          expander: {
            straight: false
          },
          columns: [
            { id: 1, label: 'ID', value: 'id', width: 40 },
            { id: 2, label: 'Description', value: 'label', width: 200, expander: true, html: true, events: {
                click({ data, column }) {
                  alert('description clicked!\n' + data.label);
                }
              }
            },
            { id: 3, label: 'Assigned to', value: 'user', width: 130, html: true },
            {
              id: 3,
              label: 'Start',
              value: task => dayjs(task.start).format('YYYY-MM-DD'),
              width: 78
            },
            {
              id: 4,
              label: 'Type',
              value: 'type',
              width: 68
            },
            {
              id: 5,
              label: '%',
              value: 'progress',
              width: 35,
              style: {
                'task-list-header-label': {
                  'text-align': 'center',
                  width: '100%'
                },
                'task-list-item-value-container': {
                  'text-align': 'center',
                  width: '100%'
                }
              }
            }
          ]
        },
        locale: {
          name: 'en',
          Now: 'Now',
          'X-Scale': 'Zoom-X',
          'Y-Scale': 'Zoom-Y',
          'Task list width': 'Task list',
          'Before/After': 'Expand',
          'Display task list': 'Task list'
        }
      };


      const appApp = Vue.createApp({
        components: {
          'gantt-elastic': GanttElastic
        },
        data() {
          return {
            tasks: tasks.map(task => Object.assign({}, task)),
            options,
            dynamicStyle: {},
            destroy: false
          };
        },
        mounted() {
          window.ganttInstance = this.$refs.gantt;
          // Workaround for the missing gantt-elastic-ready event. Cypress needs window.app.
        }
      });

      const app = (window.app = appApp.mount("#app"));

      function addTask() {
        app.tasks.push({
          id: 88, label: 'Added task', user: 'Awesome!', parentId: 7, dependentOn: [7], start: getDate(24 * 3), duration: 1 * 24 * 60 * 60 * 1000, percent: 50, type: 'project'
        });
      }
      window.addTask = addTask;
    </script>
  </body>
</html>
