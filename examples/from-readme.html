<!DOCTYPE html>
<html charset="utf-8">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>GanttElastic editor demo</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs"></script>
    <script src="../dist/GanttElastic.umd.js"></script>
  </head>

  <body>
    <div style="width:100%;height:100%">
      <div id="app" v-if="!destroy">
        <gantt-elastic ref="gantt" :tasks="tasks" :options="options" :dynamic-style="dynamicStyle">
        </gantt-elastic>
      </div>
    </div>

    <script>
      function getDate(hours) {
        const currentDate = new Date();
        const currentYear = currentDate.getFullYear();
        const currentMonth = currentDate.getMonth() + 1;
        const currentDay = currentDate.getDate();
        const timeStamp = new Date(`${currentYear}-${currentMonth}-${currentDay} 00:00:00`).getTime();
        return new Date(timeStamp + hours * 60 * 60 * 1000).getTime();
      }

      let tasks = [
        {
          id: 1,
          label: 'Make some noise',
          user: '<a href="https://www.google.com/search?q=John+Doe" target="_blank" style="color:#0077c0;">John Doe</a>',
          start: getDate(-24 * 5),
          duration: 15 * 24 * 60 * 60 * 1000,
          progress: 85,
          type: 'project'
        },
        {
          id: 2,
          label: 'With great power comes great responsibility',
          user: '<a href="https://www.google.com/search?q=Peter+Parker" target="_blank" style="color:#0077c0;">Peter Parker</a>',
          parentId: 1,
          start: getDate(-24 * 4),
          duration: 4 * 24 * 60 * 60 * 1000,
          progress: 50,
          type: 'milestone',
          collapsed: true,
          style: { base: { fill: '#1EBC61', stroke: '#0EAC51' } }
        },
        {
          id: 3,
          label: 'Courage is being scared to death, but saddling up anyway.',
          user: '<a href="https://www.google.com/search?q=John+Wayne" target="_blank" style="color:#0077c0;">John Wayne</a>',
          parentId: 2,
          start: getDate(-24 * 3),
          duration: 2 * 24 * 60 * 60 * 1000,
          progress: 100,
          type: 'task'
        },
        {
          id: 4,
          label: 'Put that toy AWAY!',
          user: '<a href="https://www.google.com/search?q=Clark+Kent" target="_blank" style="color:#0077c0;">Clark Kent</a>',
          start: getDate(-24 * 2),
          duration: 2 * 24 * 60 * 60 * 1000,
          progress: 50,
          type: 'task',
          dependentOn: [3]
        }
      ];

      let options = {
        maxRows: 100,
        maxHeight: 300,
        title: {
          label: 'Your project title as html (link or whatever...)',
          html: false
        },
        row: { height: 24 },
        calendar: { hour: { display: false } },
        chart: { progress: { bar: false }, expander: { display: true } },
        taskList: {
          expander: { straight: false },
          columns: [
            { id: 1, label: 'ID', value: 'id', width: 40 },
            {
              id: 2,
              label: 'Description',
              value: 'label',
              width: 200,
              expander: true,
              html: true,
              events: {
                click({ data, column }) {
                  alert('description clicked!\n' + data.label);
                }
              }
            },
            { id: 3, label: 'Assigned to', value: 'user', width: 130, html: true },
            { id: 3, label: 'Start', value: task => dayjs(task.start).format('YYYY-MM-DD'), width: 78 },
            { id: 4, label: 'Type', value: 'type', width: 68 },
            {
              id: 5,
              label: '%',
              value: 'progress',
              width: 35,
              style: {
                'task-list-header-label': { 'text-align': 'center', width: '100%' },
                'task-list-item-value-container': { 'text-align': 'center', width: '100%' }
              }
            }
          ]
        },
        locale: {
          name: 'en',
          Now: 'Now',
          'X-Scale': 'Zoom-X',
          'Y-Scale': 'Zoom-Y',
          'Task list width': 'Task list',
          'Before/After': 'Expand',
          'Display task list': 'Task list'
        }
      };

      const appApp = Vue.createApp({
        components: {
          'gantt-elastic': GanttElastic,
          'gantt-footer': {
            template: `<span>this is a footer</span>`
          }
        },
        data() {
          return {
            tasks: tasks.map(task => Object.assign({}, task)),
            options,
            dynamicStyle: {
              'task-list-header-label': { 'font-weight': 'bold' }
            },
            destroy: false
          };
        },
        mounted() {
          window.ganttInstance = this.$refs.gantt;
          const ganttInstance = window.ganttInstance;

          ganttInstance.$on('tasks-changed', tasks => {
            this.tasks = tasks;
          });
          ganttInstance.$on('options-changed', options => {
            this.options = options;
          });
          ganttInstance.$on('dynamic-style-changed', style => {
            this.dynamicStyle = style;
          });

          ganttInstance.$on('chart-task-mouseenter', ({ data, event }) => {
            console.log('task mouse enter', { data, event });
          });
          ganttInstance.$on('updated', () => {
            //console.log('gantt view was updated');
          });
          ganttInstance.$on('destroyed', () => {
            //console.log('gantt was destroyed');
          });
          ganttInstance.$on('times-timeZoom-updated', () => {
            console.log('time zoom changed');
          });
          ganttInstance.$on('taskList-task-click', ({ event, data, column }) => {
            console.log('task list clicked! (task)', { data, column });
          });
        }
      });

      const app = (window.app = appApp.mount("#app"));
    </script>
  </body>
</html>
